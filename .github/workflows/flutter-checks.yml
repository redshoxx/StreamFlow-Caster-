name: Flutter checks

on:
  push:
    paths: ["apps/mobile/**", ".github/workflows/flutter-checks.yml"]
  pull_request:
    paths: ["apps/mobile/**", ".github/workflows/flutter-checks.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Preserve resolved dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: StreamFlow-pubspec-lock
          path: apps/mobile/pubspec.lock
          if-no-files-found: error
