name: Flutter checks

on:
  push:
    paths: ["apps/mobile/**", ".github/workflows/flutter-checks.yml"]
  pull_request:
    paths: ["apps/mobile/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
