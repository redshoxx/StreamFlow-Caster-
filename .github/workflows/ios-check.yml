name: iOS AltStore IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "assets/streamflow-icon.png"
      - "scripts/configure-mobile-ios.sh"
      - ".github/workflows/ios-check.yml"

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true
      - name: Create iOS platform project
        run: flutter create --platforms=ios --org com.redshoxx --project-name streamflow .
      - name: Configure StreamFlow iOS release settings
        run: bash ../../scripts/configure-mobile-ios.sh ios
      - name: Resolve packages
        run: flutter pub get
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Package IPA for AltStore signing
        run: |
          rm -rf ../../dist
          mkdir -p ../../dist/Payload
          cp -R build/ios/iphoneos/Runner.app ../../dist/Payload/Runner.app
          cd ../../dist
          /usr/bin/zip -qry StreamFlow-iOS-unsigned.ipa Payload
          rm -rf Payload
          shasum -a 256 StreamFlow-iOS-unsigned.ipa > StreamFlow-iOS-unsigned.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: StreamFlow-iOS-AltStore
          path: |
            dist/StreamFlow-iOS-unsigned.ipa
            dist/StreamFlow-iOS-unsigned.sha256
          if-no-files-found: error
