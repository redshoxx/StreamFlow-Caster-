name: Android Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/mobile/**"]

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.redshoxx --project-name streamflow .
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: StreamFlow-Mobile-release
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
