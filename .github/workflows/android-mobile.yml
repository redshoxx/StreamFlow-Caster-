name: Android Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/android-mobile.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true
      - name: Create Android platform project
        run: flutter create --platforms=android --org com.redshoxx --project-name streamflow .
      - name: Resolve packages
        run: flutter pub get
      - name: Build optimized APK
        run: flutter build apk --release
      - name: Prepare and optionally production-sign APK
        env:
          MOBILE_KEYSTORE_BASE64: ${{ secrets.ANDROID_MOBILE_KEYSTORE_BASE64 }}
          MOBILE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_MOBILE_KEYSTORE_PASSWORD }}
          MOBILE_KEY_ALIAS: ${{ secrets.ANDROID_MOBILE_KEY_ALIAS }}
          MOBILE_KEY_PASSWORD: ${{ secrets.ANDROID_MOBILE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../../dist/StreamFlow-Mobile-test.apk

          if [ -n "${MOBILE_KEYSTORE_BASE64:-}" ] && [ -n "${MOBILE_KEYSTORE_PASSWORD:-}" ] && [ -n "${MOBILE_KEY_ALIAS:-}" ] && [ -n "${MOBILE_KEY_PASSWORD:-}" ]; then
            echo "$MOBILE_KEYSTORE_BASE64" | base64 --decode > /tmp/streamflow-mobile.jks
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            "$APKSIGNER" sign \
              --ks /tmp/streamflow-mobile.jks \
              --ks-key-alias "$MOBILE_KEY_ALIAS" \
              --ks-pass env:MOBILE_KEYSTORE_PASSWORD \
              --key-pass env:MOBILE_KEY_PASSWORD \
              --out ../../dist/StreamFlow-Mobile-release.apk \
              ../../dist/StreamFlow-Mobile-test.apk
            "$APKSIGNER" verify --verbose --print-certs ../../dist/StreamFlow-Mobile-release.apk
            rm -f /tmp/streamflow-mobile.jks
          else
            echo "Mobile signing secrets are not configured; producing an installable test APK only."
          fi

          cd ../../dist
          sha256sum StreamFlow-Mobile-*.apk > StreamFlow-Mobile.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: StreamFlow-Mobile
          path: |
            dist/StreamFlow-Mobile-test.apk
            dist/StreamFlow-Mobile-release.apk
            dist/StreamFlow-Mobile.sha256
          if-no-files-found: warn
