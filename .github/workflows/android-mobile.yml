name: Android Mobile Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "scripts/configure-mobile-android.py"
      - ".github/workflows/android-mobile.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          cache: true
      - name: Create Android platform project
        run: flutter create --platforms=android --org com.redshoxx --project-name streamflow .
      - name: Restore StreamFlow tests after platform generation
        run: git checkout -- test
      - name: Configure Android release settings
        run: python3 ../../scripts/configure-mobile-android.py android/app/src/main/AndroidManifest.xml
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze release source
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release
      - name: Prepare release APK
        env:
          MOBILE_KEYSTORE_BASE64: ${{ secrets.ANDROID_MOBILE_KEYSTORE_BASE64 }}
          MOBILE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_MOBILE_KEYSTORE_PASSWORD }}
          MOBILE_KEY_ALIAS: ${{ secrets.ANDROID_MOBILE_KEY_ALIAS }}
          MOBILE_KEY_PASSWORD: ${{ secrets.ANDROID_MOBILE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ../../dist
          cp build/app/outputs/flutter-apk/app-release.apk ../../dist/StreamFlow-Mobile-release.apk

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ -n "${MOBILE_KEYSTORE_BASE64:-}" ] && [ -n "${MOBILE_KEYSTORE_PASSWORD:-}" ] && [ -n "${MOBILE_KEY_ALIAS:-}" ] && [ -n "${MOBILE_KEY_PASSWORD:-}" ]; then
            echo "$MOBILE_KEYSTORE_BASE64" | base64 --decode > /tmp/streamflow-mobile.jks
            "$APKSIGNER" sign \
              --ks /tmp/streamflow-mobile.jks \
              --ks-key-alias "$MOBILE_KEY_ALIAS" \
              --ks-pass env:MOBILE_KEYSTORE_PASSWORD \
              --key-pass env:MOBILE_KEY_PASSWORD \
              --out ../../dist/StreamFlow-Mobile-release-signed.apk \
              ../../dist/StreamFlow-Mobile-release.apk
            mv ../../dist/StreamFlow-Mobile-release-signed.apk ../../dist/StreamFlow-Mobile-release.apk
            rm -f /tmp/streamflow-mobile.jks
          fi

          "$APKSIGNER" verify --verbose --print-certs ../../dist/StreamFlow-Mobile-release.apk
          cd ../../dist
          sha256sum StreamFlow-Mobile-release.apk > StreamFlow-Mobile-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: StreamFlow-Mobile-Release
          path: |
            dist/StreamFlow-Mobile-release.apk
            dist/StreamFlow-Mobile-release.apk.sha256
          if-no-files-found: error
