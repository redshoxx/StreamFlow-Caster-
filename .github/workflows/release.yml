name: Release StreamFlow artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.redshoxx --project-name streamflow .
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk ../../StreamFlow-Mobile-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: StreamFlow-Mobile-release.apk
          if-no-files-found: error

  tv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - run: gradle :app:assembleRelease
      - name: Sign Android TV release APK
        env:
          TV_KEYSTORE_BASE64: ${{ secrets.ANDROID_TV_KEYSTORE_BASE64 }}
          TV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TV_KEYSTORE_PASSWORD }}
          TV_KEY_ALIAS: ${{ secrets.ANDROID_TV_KEY_ALIAS }}
          TV_KEY_PASSWORD: ${{ secrets.ANDROID_TV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TV_KEYSTORE_BASE64:-}" ] || [ -z "${TV_KEYSTORE_PASSWORD:-}" ] || [ -z "${TV_KEY_ALIAS:-}" ] || [ -z "${TV_KEY_PASSWORD:-}" ]; then
            echo "Android TV release signing secrets are missing. See docs/SIGNING.md."
            exit 1
          fi
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          echo "$TV_KEYSTORE_BASE64" | base64 --decode > /tmp/streamflow-tv.jks
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" sign \
            --ks /tmp/streamflow-tv.jks \
            --ks-key-alias "$TV_KEY_ALIAS" \
            --ks-pass env:TV_KEYSTORE_PASSWORD \
            --key-pass env:TV_KEY_PASSWORD \
            --out ../../StreamFlow-TV-release.apk \
            "$RELEASE_APK"
          "$APKSIGNER" verify --verbose ../../StreamFlow-TV-release.apk
          rm -f /tmp/streamflow-tv.jks
      - uses: actions/upload-artifact@v4
        with:
          name: tv-apk
          path: StreamFlow-TV-release.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=ios --org com.redshoxx --project-name streamflow .
      - name: Configure local-network permissions
        run: |
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string StreamFlow discovers and controls receivers on your local network." "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string _streamflow._tcp" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST" || true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package AltStore IPA
        run: |
          rm -rf ../../Payload
          mkdir -p ../../Payload
          cp -R build/ios/iphoneos/Runner.app ../../Payload/Runner.app
          cd ../..
          /usr/bin/zip -qry StreamFlow-iOS-unsigned.ipa Payload
          rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: StreamFlow-iOS-unsigned.ipa
          if-no-files-found: error

  github-release:
    needs: [mobile, tv, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            StreamFlow-Mobile-release.apk
            StreamFlow-TV-release.apk
            StreamFlow-iOS-unsigned.ipa
          generate_release_notes: true
