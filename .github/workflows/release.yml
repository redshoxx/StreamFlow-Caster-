name: Release StreamFlow artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --org com.redshoxx --project-name streamflow .
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Prepare mobile artifact
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk ../../StreamFlow-Mobile-release.apk
          cd ../..
          sha256sum StreamFlow-Mobile-release.apk > StreamFlow-Mobile-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-apk
          path: |
            StreamFlow-Mobile-release.apk
            StreamFlow-Mobile-release.apk.sha256
          if-no-files-found: error

  tv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android-tv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
      - run: gradle :app:assembleDebug :app:assembleRelease
      - name: Prepare Android TV artifacts
        env:
          TV_KEYSTORE_BASE64: ${{ secrets.ANDROID_TV_KEYSTORE_BASE64 }}
          TV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_TV_KEYSTORE_PASSWORD }}
          TV_KEY_ALIAS: ${{ secrets.ANDROID_TV_KEY_ALIAS }}
          TV_KEY_PASSWORD: ${{ secrets.ANDROID_TV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk ../../StreamFlow-TV-test.apk

          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"
          if [ -z "$RELEASE_APK" ]; then
            echo "No Android TV release APK was produced."
            exit 1
          fi
          cp "$RELEASE_APK" ../../StreamFlow-TV-release-unsigned.apk

          if [ -n "${TV_KEYSTORE_BASE64:-}" ] && [ -n "${TV_KEYSTORE_PASSWORD:-}" ] && [ -n "${TV_KEY_ALIAS:-}" ] && [ -n "${TV_KEY_PASSWORD:-}" ]; then
            echo "$TV_KEYSTORE_BASE64" | base64 --decode > /tmp/streamflow-tv.jks
            APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
            "$APKSIGNER" sign \
              --ks /tmp/streamflow-tv.jks \
              --ks-key-alias "$TV_KEY_ALIAS" \
              --ks-pass env:TV_KEYSTORE_PASSWORD \
              --key-pass env:TV_KEY_PASSWORD \
              --out ../../StreamFlow-TV-release.apk \
              ../../StreamFlow-TV-release-unsigned.apk
            "$APKSIGNER" verify --verbose ../../StreamFlow-TV-release.apk
            rm -f /tmp/streamflow-tv.jks
          else
            echo "TV signing secrets are not configured. Publishing test + unsigned release APKs."
          fi

          cd ../..
          sha256sum StreamFlow-TV-*.apk > StreamFlow-TV.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: tv-apk
          path: |
            StreamFlow-TV-test.apk
            StreamFlow-TV-release-unsigned.apk
            StreamFlow-TV-release.apk
            StreamFlow-TV.sha256
          if-no-files-found: warn

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=ios --org com.redshoxx --project-name streamflow .
      - name: Configure local-network permissions
        run: |
          PLIST="ios/Runner/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string StreamFlow discovers and controls receivers on your local network." "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string _streamflow._tcp" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST" || true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package AltStore IPA
        run: |
          rm -rf ../../Payload
          mkdir -p ../../Payload
          cp -R build/ios/iphoneos/Runner.app ../../Payload/Runner.app
          cd ../..
          /usr/bin/zip -qry StreamFlow-iOS-unsigned.ipa Payload
          rm -rf Payload
          shasum -a 256 StreamFlow-iOS-unsigned.ipa > StreamFlow-iOS-unsigned.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            StreamFlow-iOS-unsigned.ipa
            StreamFlow-iOS-unsigned.ipa.sha256
          if-no-files-found: error

  github-release:
    needs: [mobile, tv, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            StreamFlow-Mobile-release.apk
            StreamFlow-Mobile-release.apk.sha256
            StreamFlow-TV-*.apk
            StreamFlow-TV.sha256
            StreamFlow-iOS-unsigned.ipa
            StreamFlow-iOS-unsigned.ipa.sha256
          generate_release_notes: true
